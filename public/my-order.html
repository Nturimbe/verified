<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified — Track My Order</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #F4FBF7; min-height: 100vh; padding-bottom: 40px; }
    .header { background: #2E7D52; padding: 18px 20px; text-align: center; }
    .header h1 { color: #E8A020; font-size: 24px; }
    .header p  { color: #A8C5B0; font-size: 13px; margin-top: 4px; }
    .card {
      background: white; margin: 20px 16px 0;
      border-radius: 12px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 { color: #2E7D52; font-size: 16px; margin-bottom: 14px; }
    input {
      display: block; width: 100%; padding: 13px 14px;
      border: 1.5px solid #DDD; border-radius: 8px;
      font-size: 15px; color: #2E7D52; margin-bottom: 12px; outline: none;
    }
    input:focus { border-color: #2E7D52; }
    .btn {
      display: block; width: 100%; padding: 14px;
      background: #2E7D52; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; margin-top: 14px; }
    .value { font-size: 16px; color: #2E7D52; font-weight: bold; }
    .amount { font-size: 28px; color: #2E7D52; font-weight: bold; }
    .timeline { margin-top: 20px; }
    .step {
      display: flex; align-items: flex-start; margin-bottom: 14px;
    }
    .dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-right: 12px; margin-top: 2px;
    }
    .dot.done    { background: #2E7D52; color: white; }
    .dot.current { background: #E8A020; color: white; }
    .dot.pending { background: #EEE; color: #888; }
    .step-text strong { font-size: 14px; color: #2E7D52; display: block; }
    .step-text span   { font-size: 12px; color: #888; }
    .action-btn {
      display: block; width: 100%; padding: 14px;
      background: #E8A020; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: bold;
      cursor: pointer; margin-top: 16px; text-decoration: none;
      text-align: center;
    }
    #loading { text-align: center; color: #888; padding: 30px; }
  </style>

  //Navigation script for transaction history.
  <script src="/nav.js"></script>
</head>
<body>
  <div class="header">
    <h1>✓ Verified</h1>
    <p>Track My Order</p>
  </div>

  <div class="card" id="searchCard">
  <h2>Find your orders</h2>
  <input type="tel" id="phoneInput"
    placeholder="Enter your WhatsApp or phone number"
    maxlength="13" />
  <button class="btn" onclick="findOrders()">Find My Orders</button>
</div>

<div id="orderList"></div>
  <script>
   async function findOrders() {
  const phone = document.getElementById('phoneInput').value.trim();
  if (!phone || phone.length < 10) {
    alert('Please enter your phone number.');
    return;
  }

  const list = document.getElementById('orderList');
  list.innerHTML = '<div class="empty">Loading your orders...</div>';

  try {
    const res  = await fetch(`/transactions/buyer/${encodeURIComponent(phone)}`);
    const data = await res.json();

    if (!res.ok) {
      list.innerHTML = `<div class="empty">${data.error || 'Could not load orders.'}</div>`;
      return;
    }

    if (data.length === 0) {
      list.innerHTML = '<div class="empty">No orders found for this number.</div>';
      return;
    }

    const stateLabel = {
      CREATED:    '⏳ Awaiting payment',
      FUNDED:     '💰 Paid — awaiting dispatch',
      DISPATCHED: '🚚 On the way',
      CONFIRMED:  '✅ Completed',
      DISPUTED:   '🔒 Dispute in progress',
      RESOLVED:   '✅ Resolved'
    };

    list.innerHTML = data.map(tx => {
      const date = new Date(tx.createdAt).toLocaleDateString('en-GH', {
        day: 'numeric', month: 'short', year: 'numeric'
      });

      let action = '';
      if (tx.state === 'DISPATCHED') {
        action = `<a class="tx-link" href="/confirm.html?id=${tx.id}">Confirm Receipt →</a>`;
      }

      return `
        <div class="tx-card ${tx.state}">
          <div class="tx-header">
            <div class="tx-item">${tx.itemName}</div>
            <div class="tx-amount">GHS ${tx.amount.toLocaleString()}</div>
          </div>
          <div class="tx-meta">${date}</div>
          <span class="tx-state state-${tx.state}">
            ${stateLabel[tx.state] || tx.state}
          </span>
          ${action ? `<div class="tx-actions">${action}</div>` : ''}
        </div>`;
    }).join('');

  } catch (err) {
    list.innerHTML = '<div class="empty">Could not connect. Try again.</div>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('phoneInput')
    .addEventListener('keypress', e => {
      if (e.key === 'Enter') findOrders();
    });
});
  </script>
</body>
</html>
