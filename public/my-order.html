<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified — Track My Order</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #F4FBF7; min-height: 100vh; padding-bottom: 40px; }
    .header { background: #2E7D52; padding: 18px 20px; text-align: center; }
    .header h1 { color: #E8A020; font-size: 24px; }
    .header p  { color: #A8C5B0; font-size: 13px; margin-top: 4px; }
    .card {
      background: white; margin: 20px 16px 0;
      border-radius: 12px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 { color: #2E7D52; font-size: 16px; margin-bottom: 14px; }
    input {
      display: block; width: 100%; padding: 13px 14px;
      border: 1.5px solid #DDD; border-radius: 8px;
      font-size: 15px; color: #2E7D52; margin-bottom: 12px; outline: none;
    }
    input:focus { border-color: #2E7D52; }
    .btn {
      display: block; width: 100%; padding: 14px;
      background: #2E7D52; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; margin-top: 14px; }
    .value { font-size: 16px; color: #2E7D52; font-weight: bold; }
    .amount { font-size: 28px; color: #2E7D52; font-weight: bold; }
    .timeline { margin-top: 20px; }
    .step {
      display: flex; align-items: flex-start; margin-bottom: 14px;
    }
    .dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-right: 12px; margin-top: 2px;
    }
    .dot.done    { background: #2E7D52; color: white; }
    .dot.current { background: #E8A020; color: white; }
    .dot.pending { background: #EEE; color: #888; }
    .step-text strong { font-size: 14px; color: #2E7D52; display: block; }
    .step-text span   { font-size: 12px; color: #888; }
    .action-btn {
      display: block; width: 100%; padding: 14px;
      background: #E8A020; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: bold;
      cursor: pointer; margin-top: 16px; text-decoration: none;
      text-align: center;
    }
    #loading { text-align: center; color: #888; padding: 30px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✓ Verified</h1>
    <p>Track My Order</p>
  </div>

  <div class="card" id="searchCard">
    <h2>Find your order</h2>
    <input type="text" id="txInput"
      placeholder="Paste your transaction ID or payment link" />
    <button class="btn" onclick="findOrder()">Find Order</button>
  </div>

  <div id="orderCard" style="display:none;"></div>

  <script>
    function extractId(input) {
      input = input.trim();
      // If it looks like a URL, extract the ID
      const urlMatch = input.match(/\/pay\/([a-f0-9-]{36})/);
      if (urlMatch) return urlMatch[1];
      // If it looks like a UUID
      if (/^[a-f0-9-]{36}$/.test(input)) return input;
      return null;
    }

    async function findOrder() {
      const raw  = document.getElementById('txInput').value;
      const txId = extractId(raw);

      if (!txId) {
        alert('Please paste your full payment link or transaction ID.');
        return;
      }

      document.getElementById('searchCard').innerHTML =
        '<div id="loading">Loading your order...</div>';

      try {
        const res  = await fetch(`/transactions/${txId}`);
        const data = await res.json();

        if (!res.ok || !data.id) {
          document.getElementById('searchCard').innerHTML =
            '<div class="card"><p style="color:#C0392B;padding:10px">Order not found. Check your link and try again.</p></div>';
          return;
        }

        document.getElementById('searchCard').style.display = 'none';

        const steps = [
          {
            label: 'Payment Secured',
            desc:  'Your payment is held safely in escrow',
            states: ['FUNDED','DISPATCHED','CONFIRMED','DISPUTED','RESOLVED']
          },
          {
            label: 'Item Dispatched',
            desc:  'Seller has sent your item',
            states: ['DISPATCHED','CONFIRMED','RESOLVED']
          },
          {
            label: 'Delivery Confirmed',
            desc:  'You confirmed receipt — seller paid',
            states: ['CONFIRMED','RESOLVED']
          }
        ];

        const stateOrder = ['CREATED','FUNDED','DISPATCHED','CONFIRMED','RESOLVED'];
        const currentIdx = stateOrder.indexOf(data.state);

        const timelineHtml = steps.map((step, i) => {
          const isDisputed = data.state === 'DISPUTED';
          const isDone     = step.states.includes(data.state) &&
                             stateOrder.indexOf(step.states[0]) < currentIdx;
          const isCurrent  = step.states[0] === data.state;

          let dotClass = 'pending';
          let icon     = (i + 1).toString();

          if (isDisputed && i === 1) {
            dotClass = 'current'; icon = '⚠';
          } else if (isDone)    { dotClass = 'done';    icon = '✓'; }
          else if (isCurrent)   { dotClass = 'current'; icon = '→'; }

          return `
            <div class="step">
              <div class="dot ${dotClass}">${icon}</div>
              <div class="step-text">
                <strong>${step.label}</strong>
                <span>${isDisputed && i === 1 ? 'Dispute in progress — funds frozen' : step.desc}</span>
              </div>
            </div>`;
        }).join('');

        let actionHtml = '';
        if (data.state === 'DISPATCHED') {
          actionHtml = `
            <a class="action-btn" href="/confirm.html?id=${data.id}">
              Confirm Receipt
            </a>`;
        }

        const orderCard = document.getElementById('orderCard');
        orderCard.style.display = 'block';
        orderCard.innerHTML = `
          <div class="card">
            <div class="label">Item</div>
            <div class="value">${data.itemName}</div>
            <div class="label">Amount</div>
            <div class="amount">GHS ${data.amount.toLocaleString()}</div>
            <div class="timeline" style="margin-top:20px;">
              ${timelineHtml}
            </div>
            ${actionHtml}
          </div>`;

      } catch (err) {
        document.getElementById('searchCard').innerHTML =
          '<div class="card"><p style="color:#C0392B;padding:10px">Could not connect. Check your internet and try again.</p></div>';
      }
    }
  </script>
</body>
</html>
