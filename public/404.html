<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified — Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #F4FBF7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo { font-size: 32px; color: #E8A020; font-family: Georgia, serif; margin-bottom: 24px; }
    .code { font-size: 72px; font-weight: bold; color: #EDF7F2; font-family: Georgia, serif; line-height: 1; }
    h1 { font-size: 22px; color: #1B5C3A; margin: 12px 0 8px; }
    p  { font-size: 14px; color: #888; max-width: 300px; line-height: 1.6; margin-bottom: 28px; }
    .links { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
    .btn-home {
      display: block; padding: 14px;
      background: #2E7D52; color: white;
      border-radius: 8px; font-size: 15px;
      font-weight: bold; text-decoration: none;
    }
    .btn-track {
      display: block; padding: 13px;
      background: transparent; color: #2E7D52;
      border: 2px solid #2E7D52;
      border-radius: 8px; font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="logo">✓ Verified</div>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>This page does not exist or the link has expired. Try one of these instead.</p>
  <div class="links">
    <a href="/" class="btn-home">Go to Home</a>
    <a href="/my-order.html" class="btn-track">Track My Order</a>
  </div>
</body>
</html>
