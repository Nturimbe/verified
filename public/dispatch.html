<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified — Dispatch Item</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #F4F7FB; min-height: 100vh; padding-bottom: 40px; }
    .header { background: #1B3A6B; padding: 18px 20px; text-align: center; }
    .header h1 { color: #C8922A; font-size: 26px; }
    .header p  { color: #AABBD4; font-size: 13px; margin-top: 4px; }
    .card {
      background: white; margin: 20px 16px 0;
      border-radius: 12px; padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .value { font-size: 16px; color: #1B3A6B; font-weight: bold; margin-bottom: 16px; }
    .amount { font-size: 32px; color: #1B3A6B; font-weight: bold; margin-bottom: 4px; }
    .info-box {
      background: #EEF3FA; border-left: 4px solid #C8922A;
      border-radius: 0 8px 8px 0; padding: 14px 16px; margin: 16px 0;
      font-size: 13px; color: #444; line-height: 1.6;
    }
    .btn {
      display: block; width: 100%; padding: 16px;
      background: #1B3A6B; color: white; border: none;
      border-radius: 8px; font-size: 17px; font-weight: bold;
      cursor: pointer; margin-top: 8px; text-align: center;
    }
    .btn:active { opacity: 0.85; }
    .btn-disabled { background: #CCCCCC; cursor: not-allowed; }
    .done-card {
      display: none; background: #EEF3FA;
      border-left: 4px solid #27AE60; border-radius: 0 8px 8px 0;
      padding: 20px; margin-top: 16px;
    }
    .done-card h3 { color: #27AE60; margin-bottom: 8px; }
    .done-card p  { color: #555; font-size: 14px; line-height: 1.5; }
    .divider { border: none; border-top: 1px solid #EEE; margin: 16px 0; }
    #loading { color: #888; font-size: 14px; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✓ Verified</h1>
    <p>Seller Dispatch</p>
  </div>

  <div class="card" id="mainCard">
    <div id="loading">Loading transaction...</div>
  </div>

  <script>
    function showPreDispatchDispute() {
  document.getElementById('preDisputeForm').style.display = 'block';
}

async function submitPreDispute() {
  const reason = document.getElementById('preDisputeReason').value.trim();
  if (!reason) {
    alert('Please describe the problem.');
    return;
  }

  try {
    const res = await fetch('/disputes', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        transactionId:  txId,
        reason:         reason,
        reasonCategory: 'SELLER_COMPLAINT',
        raisedBy:       'SELLER'
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(`Could not raise dispute: ${data.error}`);
      return;
    }

    document.getElementById('mainCard').innerHTML = `
      <div style="text-align:center;font-size:48px;margin-bottom:12px">🔒</div>
      <h2 style="color:#1B3A6B;text-align:center;margin-bottom:8px">Dispute Raised</h2>
      <p style="color:#555;text-align:center;font-size:14px;">
        Funds are frozen. The Verified team will contact both parties within 48 hours.
      </p>
      <p style="text-align:center;font-size:12px;color:#888;margin-top:8px;">
        Reference: ${data.disputeId.split('-')[0]}...
      </p>`;

  } catch (err) {
    alert('Something went wrong. Please try again.');
  }
}
    function showDisputeForm() {
  document.getElementById('disputeForm').style.display = 'block';
  document.querySelector('#doneCard button').style.display = 'none';
}

async function submitSellerDispute() {
  const reason = document.getElementById('disputeReason').value.trim();
  if (!reason) {
    alert('Please describe the problem before submitting.');
    return;
  }

  try {
    const res = await fetch('/disputes', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        transactionId: txId,
        reason:        reason,
        reasonCategory: 'SELLER_COMPLAINT',
        raisedBy:      'SELLER'
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(`Could not raise dispute: ${data.error}`);
      return;
    }

    document.getElementById('disputeForm').innerHTML = `
      <div style="background:#EEF3FA;border-left:4px solid #C0392B;
        border-radius:0 8px 8px 0;padding:16px;margin-top:8px;">
        <h3 style="color:#C0392B;margin-bottom:8px;">🔒 Dispute Raised</h3>
        <p style="font-size:14px;color:#555;">
          Your dispute has been submitted. Funds are frozen.
          The Verified team will contact both parties within 48 hours.
        </p>
        <p style="font-size:12px;color:#888;margin-top:8px;">
          Reference: ${data.disputeId.split('-')[0]}...
        </p>
      </div>`;

  } catch (err) {
    alert('Something went wrong. Please try again.');
  }
}
    const params = new URLSearchParams(window.location.search);
    const txId   = params.get('id');

    async function loadTransaction() {
      if (!txId) {
        document.getElementById('loading').innerHTML =
          '<p style="color:#C0392B">Invalid dispatch link.</p>';
        return;
      }

      try {
        const res  = await fetch(`/transactions/${txId}`);
        const data = await res.json();

        if (!res.ok || !data.id) {
          document.getElementById('loading').innerHTML =
            '<p style="color:#C0392B">Transaction not found.</p>';
          return;
        }

        const card = document.getElementById('mainCard');

        if (data.state === 'DISPATCHED') {
          card.innerHTML = `
            <div style="text-align:center;font-size:48px;margin-bottom:12px">✅</div>
            <h2 style="color:#1B3A6B;text-align:center;margin-bottom:8px">Already Dispatched</h2>
            <p style="color:#888;text-align:center;font-size:14px">
              You have already marked this item as dispatched.<br>
              Waiting for buyer to confirm receipt.
            </p>`;
          return;
        }

        if (data.state === 'CONFIRMED' || data.state === 'RESOLVED') {
          card.innerHTML = `
            <div style="text-align:center;font-size:48px;margin-bottom:12px">💰</div>
            <h2 style="color:#27AE60;text-align:center;margin-bottom:8px">Transaction Complete</h2>
            <p style="color:#888;text-align:center;font-size:14px">
              Buyer confirmed receipt. Your funds have been released.
            </p>`;
          return;
        }

        if (data.state !== 'FUNDED') {
          card.innerHTML = `
            <div style="text-align:center;font-size:48px;margin-bottom:12px">⏳</div>
            <h2 style="color:#1B3A6B;text-align:center;margin-bottom:8px">Not Ready</h2>
            <p style="color:#888;text-align:center;font-size:14px">
              This transaction is not yet funded. Current status: ${data.state}
            </p>`;
          return;
        }

        card.innerHTML = `
          <div class="label">Item</div>
          <div class="value">${data.itemName}</div>

          <div class="label">Amount in Escrow</div>
          <div class="amount">GHS ${data.amount.toLocaleString()}</div>

          <hr class="divider">

          <div class="label">Buyer</div>
          <div class="value">${data.buyerName || 'Buyer'} ${data.buyerPhone ? '· ' + data.buyerPhone : ''}</div>

          <div class="label">Delivery Window</div>
          <div class="value">${data.deliveryHours} hours</div>

          <div class="info-box">
            <strong>Ready to dispatch?</strong><br>
            Once you click the button below, your buyer receives an SMS with a confirmation link.
            Funds are released to your MoMo only after they confirm receipt.
          </div>

          <button class="btn" id="dispatchBtn" onclick="markDispatched()">
            ✓ I Have Dispatched This Item
          </button>
          <button class="btn" id="dispatchBtn" onclick="markDispatched()">
  ✓ I Have Dispatched This Item
</button>

<p style="text-align:center;margin-top:14px;font-size:13px;color:#888;">
  Problem before dispatching?
  <a href="#" style="color:#C0392B;" onclick="showPreDispatchDispute()">Raise a dispute</a>
</p>

<div id="preDisputeForm" style="display:none;margin-top:12px;">
  <textarea id="preDisputeReason"
    placeholder="Describe the problem (e.g. buyer asked to cancel, suspicious request...)"
    style="width:100%;padding:12px;border:1.5px solid #DDD;border-radius:8px;
    font-size:14px;font-family:Arial,sans-serif;height:80px;resize:vertical;"></textarea>
  <button class="btn" style="margin-top:8px;background:#C0392B;" onclick="submitPreDispute()">
    Submit Dispute
  </button>
</div>

          <div class="done-card" id="doneCard">
  <h3>✓ Dispatch Confirmed</h3>
  <p>Your buyer has been notified via SMS with a confirmation link.
  Funds will be released to your MoMo once they confirm receipt.</p>
  <p style="margin-top:14px;font-size:13px;color:#888;">
    If your item is returned or the buyer is unresponsive after the delivery window,
    you can raise a dispute below.
  </p>
  <button class="btn" style="background:#C0392B;margin-top:12px;" onclick="showDisputeForm()">
    Raise a Problem
  </button>
</div>

<div id="disputeForm" style="display:none;margin-top:16px;">
  <div class="info-box" style="border-left-color:#C0392B;">
    <strong>Raise a dispute as seller.</strong><br>
    Describe what went wrong. Funds remain frozen until the Verified team resolves it.
  </div>
  <textarea id="disputeReason" placeholder="Describe the problem (e.g. item was returned, buyer unresponsive after 72 hours...)"
    style="width:100%;padding:12px;border:1.5px solid #DDD;border-radius:8px;
    font-size:14px;font-family:Arial,sans-serif;height:90px;
    resize:vertical;margin-top:10px;"></textarea>
  <button class="btn" style="margin-top:10px;background:#C0392B;" onclick="submitSellerDispute()">
    Submit Dispute
  </button>
</div>
        `;

      } catch (err) {
        document.getElementById('loading').innerHTML =
          '<p style="color:#C0392B">Could not load transaction. Check your connection.</p>';
      }
    }

    async function markDispatched() {
      const btn = document.getElementById('dispatchBtn');
      btn.textContent = 'Marking as dispatched...';
      btn.classList.add('btn-disabled');
      btn.disabled = true;

      try {
        const res = await fetch(`/transactions/${txId}/state`, {
          method:  'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ newState: 'DISPATCHED' })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(`Error: ${data.error}`);
          btn.textContent = '✓ I Have Dispatched This Item';
          btn.classList.remove('btn-disabled');
          btn.disabled = false;
          return;
        }

        btn.style.display = 'none';
        document.getElementById('doneCard').style.display = 'block';

      } catch (err) {
        alert('Something went wrong. Please try again.');
        btn.textContent = '✓ I Have Dispatched This Item';
        btn.classList.remove('btn-disabled');
        btn.disabled = false;
      }
    }

    loadTransaction();
  </script>
</body>
</html>
