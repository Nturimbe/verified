<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified — Admin Disputes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #F4F7FB; min-height: 100vh; }
    .header {
      background: #1B3A6B; padding: 18px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { color: #C8922A; font-size: 22px; }
    .header span { color: #AABBD4; font-size: 13px; }
    .container { padding: 20px 24px; max-width: 1000px; margin: 0 auto; }
    .section-title {
      font-size: 15px; font-weight: bold; color: #1B3A6B;
      margin: 20px 0 12px; text-transform: uppercase; letter-spacing: 1px;
    }
    .dispute-card {
      background: white; border-radius: 10px; padding: 18px 20px;
      margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      border-left: 4px solid #C0392B;
    }
    .dispute-card.resolved { border-left-color: #27AE60; opacity: 0.7; }
    .dispute-header {
      display: flex; justify-content: space-between;
      align-items: flex-start; margin-bottom: 10px;
    }
    .item-name { font-size: 16px; font-weight: bold; color: #1B3A6B; }
    .amount { font-size: 18px; font-weight: bold; color: #C8922A; }
    .meta { font-size: 12px; color: #888; margin-bottom: 8px; }
    .reason-box {
      background: #FFF5F5; border: 1px solid #FFD5D5;
      border-radius: 6px; padding: 10px 12px; margin: 10px 0;
      font-size: 13px; color: #444;
    }
    .response-box {
      background: #F0FFF4; border: 1px solid #C3E6CB;
      border-radius: 6px; padding: 10px 12px; margin: 10px 0;
      font-size: 13px; color: #444;
    }
    .no-response {
      background: #FFFBF0; border: 1px solid #FFE0A0;
      border-radius: 6px; padding: 10px 12px; margin: 10px 0;
      font-size: 13px; color: #888;
    }
    .audit-trail {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid #EEE;
    }
    .audit-item {
      font-size: 12px; color: #666; padding: 4px 0;
      border-bottom: 1px dashed #EEE;
    }
    .resolve-section { margin-top: 14px; }
    .resolve-section select,
    .resolve-section input,
    .resolve-section textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid #DDD;
      border-radius: 6px; font-size: 14px; margin-bottom: 10px;
      font-family: Arial, sans-serif;
    }
    .resolve-section textarea { height: 70px; resize: vertical; }
    .btn-resolve {
      width: 100%; padding: 13px; background: #1B3A6B;
      color: white; border: none; border-radius: 6px;
      font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .btn-resolve:hover { background: #162F55; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 11px; font-weight: bold; margin-left: 8px;
    }
    .badge-open     { background: #FFE0E0; color: #C0392B; }
    .badge-resolved { background: #E0FFE8; color: #27AE60; }
    .empty { text-align: center; color: #888; padding: 40px 20px; font-size: 15px; }
    .loading { text-align: center; color: #888; padding: 40px; }
    .ledger-summary {
      background: #EEF3FA; border-radius: 6px;
      padding: 10px 12px; margin: 8px 0; font-size: 12px;
    }
    .ledger-row { display: flex; justify-content: space-between; padding: 3px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✓ Verified — Admin</h1>
    <span id="disputeCount">Loading...</span>
  </div>

  <div class="container">
    <div class="section-title">Open Disputes</div>
    <div id="disputeList"><div class="loading">Loading disputes...</div></div>
  </div>

  <script>
    // Simple admin gate — change this password before going live
const ADMIN_PASSWORD = 'verified001';

const entered = sessionStorage.getItem('adminAuth');
if (entered !== ADMIN_PASSWORD) {
  const attempt = prompt('Enter admin password:');
  if (attempt !== ADMIN_PASSWORD) {
    document.body.innerHTML = '<p style="font-family:Arial;padding:40px;color:#C0392B;">Access denied.</p>';
    throw new Error('Unauthorised');
  }
  sessionStorage.setItem('adminAuth', ADMIN_PASSWORD);
}
    async function loadDisputes() {
      try {
        const res  = await fetch('/disputes');
        const data = await res.json();

        const list = document.getElementById('disputeList');
        document.getElementById('disputeCount').textContent =
          `${data.length} open dispute${data.length !== 1 ? 's' : ''}`;

        if (data.length === 0) {
          list.innerHTML = '<div class="empty">No open disputes. All clear ✓</div>';
          return;
        }

        list.innerHTML = data.map(d => {
          const tx       = d.transaction;
          const deadline = new Date(d.responseDeadline);
          const expired  = deadline < new Date();
          const ledger   = tx.ledgerEntries || [];
          const needsDual = tx.amount >= 500;

          const ledgerHtml = ledger.length > 0
            ? `<div class="ledger-summary">
                ${ledger.map(e =>
                  `<div class="ledger-row">
                    <span>${e.entryType} — ${e.account}</span>
                    <span>GHS ${e.amount}</span>
                  </div>`
                ).join('')}
               </div>`
            : '<div class="ledger-summary" style="color:#888">No ledger entries yet</div>';

          const auditHtml = d.auditLogs.map(a =>
            `<div class="audit-item">
              [${new Date(a.createdAt).toLocaleString()}]
              <strong>${a.action}</strong> by ${a.performedBy}
              ${a.note ? `— ${a.note}` : ''}
            </div>`
          ).join('');

          return `
            <div class="dispute-card" id="card-${d.id}">
              <div class="dispute-header">
                <div>
                  <div class="item-name">${tx.itemName}
                    <span class="badge badge-open">OPEN</span>
                  </div>
                  <div class="meta">
                    Dispute ID: ${d.id.split('-')[0]} |
                    Raised: ${new Date(d.createdAt).toLocaleString()} |
                    Seller deadline: ${deadline.toLocaleString()} ${expired ? '⚠️ EXPIRED' : ''}
                    ${needsDual ? ' | ⚠️ Dual approval required (GHS 500+)' : ''}
                  </div>
                </div>
                <div class="amount">GHS ${tx.amount}</div>
              </div>

              <div class="meta">
                Seller MoMo: ${tx.sellerMomo} |
                Buyer: ${tx.buyerName || 'Unknown'} (${tx.buyerPhone || 'No phone'})
              </div>

              <div class="reason-box">
                <strong>${d.raisedBy === 'SELLER' ? 'Seller' : 'Buyer'}'s reason (${d.reasonCategory}):</strong><br>
                ${d.reason}
                ${d.evidence ? `<br><br><strong>Evidence:</strong> ${d.evidence}` : ''}
              </div>

              ${d.raisedBy === 'SELLER'
                ? ''
                : d.sellerResponse
                 ? `<div class="response-box"><strong>Seller response:</strong><br>${d.sellerResponse}</div>`
                 : `<div class="no-response">Seller has not responded yet${expired ? ' — deadline passed' : ''}</div>`
          }

              <strong style="font-size:13px;color:#1B3A6B">Ledger:</strong>
              ${ledgerHtml}

              <div class="audit-trail">
                <strong style="font-size:12px;color:#888">AUDIT TRAIL</strong>
                ${auditHtml || '<div class="audit-item">No entries yet</div>'}
              </div>

              <div class="resolve-section">
                <select id="decision-${d.id}">
                  <option value="">-- Select decision --</option>
                  <option value="RELEASE_TO_SELLER">Release to Seller</option>
                  <option value="REFUND_TO_BUYER">Refund to Buyer</option>
                </select>
                <textarea id="reason-${d.id}" placeholder="Decision reason (required — this is logged permanently)"></textarea>
                <input id="decidedBy-${d.id}" placeholder="Your admin name" />
                ${needsDual
                  ? `<input id="approvedBy-${d.id}" placeholder="Second admin name (required for GHS 500+)" />`
                  : `<input id="approvedBy-${d.id}" placeholder="Second admin name (optional)" />`
                }
                <button class="btn-resolve" onclick="resolveDispute('${d.id}', ${tx.amount})">
                  Submit Decision
                </button>
              </div>
            </div>`;
        }).join('');

      } catch (err) {
        document.getElementById('disputeList').innerHTML =
          '<div class="empty">Failed to load disputes. Is the server running?</div>';
      }
    }

    async function resolveDispute(disputeId, amount) {
      const decision    = document.getElementById(`decision-${disputeId}`).value;
      const reason      = document.getElementById(`reason-${disputeId}`).value.trim();
      const decidedBy   = document.getElementById(`decidedBy-${disputeId}`).value.trim();
      const approvedBy  = document.getElementById(`approvedBy-${disputeId}`)?.value.trim();

      if (!decision)   { alert('Please select a decision.'); return; }
      if (!reason)     { alert('Decision reason is required.'); return; }
      if (!decidedBy)  { alert('Please enter your admin name.'); return; }
      if (amount >= 500 && !approvedBy) {
        alert('This transaction requires a second admin approval (GHS 500+).');
        return;
      }

      try {
        const res = await fetch(`/disputes/${disputeId}/resolve`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ decision, decisionReason: reason, decidedBy, approvedBy })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(`Error: ${data.error}`);
          return;
        }

        const card = document.getElementById(`card-${disputeId}`);
        card.style.opacity = '0.5';
        card.querySelector('.btn-resolve').textContent = `✓ Resolved: ${decision}`;
        card.querySelector('.btn-resolve').disabled    = true;
        card.querySelector('.badge-open').textContent  = 'RESOLVED';
        card.querySelector('.badge-open').className    = 'badge badge-resolved';

        setTimeout(loadDisputes, 2000);

      } catch (err) {
        alert('Failed to resolve. Check server connection.');
      }
    }

    loadDisputes();
    // Auto-refresh every 60 seconds
    setInterval(loadDisputes, 60000);
  </script>
</body>
</html>
