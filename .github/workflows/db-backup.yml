name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c -f verified-backup-$(date +%Y-%m-%d).dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-db-backup-${{ github.run_id }}
          path: verified-backup-*.dump
          retention-days: 90